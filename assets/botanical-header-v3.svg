      <path d="M0 0C-12-7-24-18-22-36C-5-32 4-18 0 0Z" fill="#C98293"/>
      <path d="M0 0C0-14 8-31 24-39C28-20 19-5 0 0Z" fill="#B49ABC"/>
      <path d="M0 0C14-10 33-11 49 0C34 14 16 16 0 0Z" fill="#AD8EB3"/>
      <path d="M0 0C14 8 22 25 16 42C-2 33-8 17 0 0Z" fill="#C68A9D"/>
