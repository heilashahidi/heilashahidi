<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="canvas" x1="35" y1="18" x2="1165" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F7"/>
      <stop offset="0.52" stop-color="#F8EEF3"/>
      <stop offset="1" stop-color="#EEE8F6"/>
    </linearGradient>
    <linearGradient id="petal" x1="870" y1="40" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9A0B3"/>
      <stop offset="1" stop-color="#AD87B7"/>
    </linearGradient>
    <linearGradient id="line" x1="88" y1="0" x2="730" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C17A94"/>
      <stop offset="0.55" stop-color="#9C759F"/>
      <stop offset="1" stop-color="#718D86"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#6F526B" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#573B55" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#canvas)"/>
  <rect width="1200" height="320" rx="28" fill="url(#dots)"/>
  <rect x="18" y="18" width="1164" height="284" rx="20" stroke="#B98CA0" stroke-opacity="0.22"/>

  <!-- Mirrored botanical circuits keep both sides precisely aligned -->
  <g id="botanical-side">
    <g stroke="#718D86" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.76">
      <path d="M0 286C34 284 55 272 70 248C78 236 82 225 84 212C89 190 91 175 94 158C97 140 99 127 102 116C105 101 107 89 110 78"/>
    </g>

    <!-- Every leaf begins at an explicit point on the main stem -->
    <g fill="#A9BBAF" fill-opacity="0.74">
      <path d="M70 248C56 247 40 238 35 225C50 226 65 235 70 248Z"/>
      <path d="M84 212C93 197 108 189 123 190C117 205 102 214 84 212Z"/>
      <path d="M94 158C79 156 65 146 61 132C77 134 91 144 94 158Z"/>
      <path d="M102 116C111 101 124 93 137 93C133 108 119 118 102 116Z"/>
    </g>
    <g stroke="#7F988F" stroke-width="1.1" stroke-linecap="round" opacity="0.62">
      <path d="M70 248L40 229"/>
      <path d="M84 212L117 193"/>
      <path d="M94 158L66 136"/>
      <path d="M102 116L132 96"/>
    </g>

    <g stroke="#B48A78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M70 248H42V267H16"/>
      <path d="M94 158H128V177H155"/>
    </g>
    <g fill="#FFF9F7" stroke="#9C759F" stroke-width="2">
      <circle cx="16" cy="267" r="5"/>
      <circle cx="155" cy="177" r="5"/>
    </g>

    <!-- Six evenly spaced petals fully surround the flower center -->
    <g transform="translate(110 78) scale(0.82)" filter="url(#shadow)">
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#C98293"/>
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#B49ABC" transform="rotate(60)"/>
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#AD8EB3" transform="rotate(120)"/>
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#C68A9D" transform="rotate(180)"/>
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#D0929F" transform="rotate(240)"/>
      <path d="M0 0C-11-8-13-23 0-38C13-23 11-8 0 0Z" fill="#B995B6" transform="rotate(300)"/>
      <g stroke="#FCEFF2" stroke-width="1.2" stroke-linecap="round" opacity="0.72">
        <path d="M0 0V-30"/>
        <path d="M0 0V-30" transform="rotate(60)"/>
        <path d="M0 0V-30" transform="rotate(120)"/>
        <path d="M0 0V-30" transform="rotate(180)"/>
        <path d="M0 0V-30" transform="rotate(240)"/>
        <path d="M0 0V-30" transform="rotate(300)"/>
      </g>
      <circle r="10" fill="#E8BD72"/>
      <circle r="4" fill="#FFF4CF"/>
      <g fill="#F8DE9C">
        <circle cx="-11" cy="-2" r="2"/>
        <circle cx="-5" cy="-10" r="2"/>
        <circle cx="5" cy="-10" r="2"/>
        <circle cx="11" cy="-2" r="2"/>
        <circle cx="7" cy="8" r="2"/>
        <circle cx="-7" cy="8" r="2"/>
      </g>
    </g>
  </g>
  <use href="#botanical-side" transform="translate(1200 0) scale(-1 1)"/>

  <!-- Typography -->
  <text x="178" y="124" fill="#432D40" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="600" letter-spacing="-1">
    Heila Shahidi
  </text>
  <path d="M180 145H719" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="732" cy="145" r="4" fill="#B48A78"/>

  <rect x="178" y="170" width="780" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.62" stroke="#B98CA0" stroke-opacity="0.35"/>
  <text x="205" y="201" fill="#684F65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="550" letter-spacing="0.4">
    SOFTWARE ENGINEER  &#183;  AI SYSTEMS  &#183;  FULL-STACK PRODUCTS
  </text>
  <text x="181" y="260" fill="#816779" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">
    growing thoughtful technology, one system at a time
  </text>
</svg>
